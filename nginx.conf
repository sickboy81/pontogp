server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Serve static assets with correct MIME types
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Garante MIME type correto para JavaScript
        types {
            application/javascript js;
            text/css css;
            image/png png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
            application/json json;
        }
    }

    # Serve other static files
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service Worker - Nunca fazer cache
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri =404;
    }

    # App Entry Point - Nunca fazer cache (para garantir updates)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires 0;
        try_files $uri =404;
    }

    # Serve Static Files (SPA) - fallback para rotas de página
    location / {
        try_files $uri $uri/ /index.html;
        # Não adicionar headers de cache aqui pois index.html é servido pelo fallback
        # e deve ser sempre revalidado
    }

    # Proxy /api requests to PocketBase
    location /api/ {
        # Proxy para o PocketBase Backend - trailing slash strips /api prefix
        proxy_pass https://pocketbase.cerejavip.com/api/;
        
        # Headers essenciais para o proxy funcionar
        proxy_ssl_server_name on;
        proxy_set_header Host pocketbase.cerejavip.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Aumentar timeouts para operações longas
        proxy_read_timeout 60s;
    }
}
